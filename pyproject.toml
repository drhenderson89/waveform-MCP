[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveform-mcp"
version = "0.1.0"
description = "MCP server giving an LLM agent control over Tracktion Waveform DAW"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jarmstrong158" }]
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "watchdog>=4",
    # Core, not dev: automation_from_features, production_analysis and the
    # audio_analysis / audio_detect / import_song tools all import numpy at
    # module level, so `pip install waveform-mcp` without it yields a package
    # that raises ImportError on use. It was undeclared and only ever worked
    # because a dev machine happened to have it.
    "numpy>=1.24",
    "pyautogui>=0.9.54",
    "pillow>=10.0",
    "psutil>=5.9",
    "pygetwindow>=0.0.9 ; sys_platform == 'win32'",
    "pywinauto>=0.6.8 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# httpx: FastAPI's TestClient, used by the preview app's security tests.
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
waveform-mcp = "waveform_mcp.server:main"
waveform-mcp-preview = "waveform_mcp.preview.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: without this the suite only runs where the package happens to be
# installed, and `pytest` in a fresh clone fails at import with
# ModuleNotFoundError rather than reporting a single failing test.
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waveform_mcp = ["preview/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
